<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ===== ПОИСК ===== */
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-bar input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
        }
        .search-bar input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        .search-bar .btn {
            padding: 12px 24px;
            width: auto;
        }

        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: scaleIn 0.3s ease;
        }
        .modal-box h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #333;
        }
        .modal-box .product-name {
            color: #4CAF50;
            font-weight: 600;
        }
        .modal-box p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .modal-box .form-group {
            margin-bottom: 15px;
        }
        .modal-box .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .modal-box .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
        }
        .modal-box .form-group input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .modal-actions .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 500;
            color: white;
        }
        .modal-actions .btn-cancel {
            background: #e0e0e0;
            color: #333;
        }
        .modal-actions .btn-cancel:hover {
            background: #d0d0d0;
        }
        .modal-actions .btn-confirm {
            background: #4CAF50;
        }
        .modal-actions .btn-confirm:hover {
            background: #388E3C;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🛍️ Маркет</div>
        <nav>
            <a href="catalog.html" class="active">🛒 Каталог</a>
            <a href="user/cart.html">🛍️ Корзина <span id="cartCount" class="badge">0</span></a>
            <a href="user/profile.html">👤 Профиль</a>
            <a href="user/orders.html">📋 Заказы</a>
            <button onclick="logout()" class="btn btn-red">🚪 Выйти</button>
        </nav>
    </header>
    <main>
        <h1>🛒 Каталог товаров</h1>

        <!-- ===== ПОИСК ===== -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Поиск товаров..." oninput="handleSearch()">
            <button class="btn btn-green" onclick="handleSearch()">🔍 Найти</button>
            <button class="btn btn-blue" onclick="clearSearch()">✖️ Сбросить</button>
        </div>

        <div class="products-grid" id="catalogGrid"></div>
    </main>

    <!-- ===== МОДАЛЬНОЕ ОКНО ===== -->
    <div class="modal-overlay" id="quantityModal">
        <div class="modal-box">
            <h3>🛒 Добавить в корзину</h3>
            <p>Товар: <span class="product-name" id="modalProductName"></span></p>
            <div class="form-group">
                <label>Количество:</label>
                <input type="number" id="modalQuantity" value="1" min="1" step="1">
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeModal()">Отмена</button>
                <button class="btn btn-confirm" onclick="confirmAddToCart()">✅ Добавить</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // =============================================
        // ПЕРЕМЕННЫЕ
        // =============================================
        let currentProductId = null;
        let currentSearchQuery = '';

        // =============================================
        // ОТОБРАЖЕНИЕ КАТАЛОГА
        // =============================================
        function renderCatalog(productsToShow) {
            const grid = document.getElementById('catalogGrid');
            const items = productsToShow || products;
            
            if (items.length === 0) {
                grid.innerHTML = `<div class="no-results">😕 Товары не найдены</div>`;
                return;
            }
            
            grid.innerHTML = items.map(p => `
                <div class="product-card">
                    <h3>${p.name}</h3>
                    <p class="desc">${p.description || 'Описание отсутствует'}</p>
                    <div class="price">${p.price.toLocaleString()} ₽</div>
                    <button onclick="openModal(${p.id})" class="btn btn-green">🛒 В корзину</button>
                </div>
            `).join('');
            updateCartBadge();
        }

        // =============================================
        // ===== 2. ПОИСК =====
        // =============================================
        function handleSearch() {
            const query = document.getElementById('searchInput').value;
            currentSearchQuery = query;
            const results = searchProducts(query);
            renderCatalog(results);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            currentSearchQuery = '';
            renderCatalog(products);
        }

        // =============================================
        // МОДАЛЬНОЕ ОКНО
        // =============================================
        function openModal(productId) {
            const product = getProduct(productId);
            if (!product) {
                showNotification('Товар не найден', 'error');
                return;
            }
            currentProductId = productId;
            document.getElementById('modalProductName').textContent = product.name;
            document.getElementById('modalQuantity').value = 1;
            document.getElementById('quantityModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('quantityModal').classList.remove('active');
            currentProductId = null;
        }

        function confirmAddToCart() {
            if (currentProductId === null) return;
            
            const quantityInput = document.getElementById('modalQuantity');
            const quantity = Number(quantityInput.value);
            
            if (isNaN(quantity) || quantity <= 0) {
                showNotification('Введите корректное количество', 'error');
                return;
            }
            
            const product = getProduct(currentProductId);
            if (!product) {
                showNotification('Товар не найден', 'error');
                closeModal();
                return;
            }
            
            addToCart(currentProductId, quantity);
            showNotification(`${product.name} добавлен в корзину (${quantity} шт.)`, 'success');
            updateCartBadge();
            closeModal();
        }

        // Закрытие по клику на оверлей
        document.getElementById('quantityModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Закрытие по ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // =============================================
        // ВЫХОД
        // =============================================
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/market/';
        }

        // =============================================
        // ИНИЦИАЛИЗАЦИЯ
        // =============================================
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if (!user) {
                window.location.href = '/market/';
                return;
            }
            // Суперпользователь тоже видит каталог
            if (user.role !== 'user' && user.role !== 'super') {
                window.location.href = '/market/';
                return;
            }
            renderCatalog(products);
            updateCartBadge();
        });
    </script>
</body>
</html>
