<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ===== МОДАЛЬНОЕ ОКНО ДЛЯ КОЛИЧЕСТВА ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: scaleIn 0.3s ease;
        }
        .modal-box h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #333;
        }
        .modal-box .product-name {
            color: #4CAF50;
            font-weight: 600;
        }
        .modal-box p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .modal-box .form-group {
            margin-bottom: 15px;
        }
        .modal-box .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .modal-box .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
        }
        .modal-box .form-group input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .modal-actions .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 500;
            color: white;
        }
        .modal-actions .btn-cancel {
            background: #e0e0e0;
            color: #333;
        }
        .modal-actions .btn-cancel:hover {
            background: #d0d0d0;
        }
        .modal-actions .btn-confirm {
            background: #4CAF50;
        }
        .modal-actions .btn-confirm:hover {
            background: #388E3C;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🛍️ Маркет</div>
        <nav>
            <a href="catalog.html" class="active">🛒 Каталог</a>
            <a href="user/cart.html">🛍️ Корзина <span id="cartCount" class="badge">0</span></a>
            <a href="user/profile.html">👤 Профиль</a>
            <a href="user/orders.html">📋 Заказы</a>
            <button onclick="logout()" class="btn btn-red">🚪 Выйти</button>
        </nav>
    </header>
    <main>
        <h1>🛒 Каталог товаров</h1>
        <div class="products-grid" id="catalogGrid"></div>
    </main>

    <!-- ===== МОДАЛЬНОЕ ОКНО ===== -->
    <div class="modal-overlay" id="quantityModal">
        <div class="modal-box">
            <h3>🛒 Добавить в корзину</h3>
            <p>Товар: <span class="product-name" id="modalProductName"></span></p>
            <div class="form-group">
                <label>Количество:</label>
                <input type="number" id="modalQuantity" value="1" min="1" step="1">
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeModal()">Отмена</button>
                <button class="btn btn-confirm" onclick="confirmAddToCart()">✅ Добавить</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // =============================================
        // ПЕРЕМЕННЫЕ ДЛЯ МОДАЛЬНОГО ОКНА
        // =============================================
        let currentProductId = null;

        // =============================================
        // ОТОБРАЖЕНИЕ КАТАЛОГА
        // =============================================
        function renderCatalog() {
            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <h3>${p.name}</h3>
                    <p class="desc">${p.description || 'Описание отсутствует'}</p>
                    <div class="price">${p.price.toLocaleString()} ₽</div>
                    <button onclick="openModal(${p.id})" class="btn btn-green">🛒 В корзину</button>
                </div>
            `).join('');
            updateCartBadge();
        }

        // =============================================
        // ОТКРЫТЬ МОДАЛЬНОЕ ОКНО
        // =============================================
        function openModal(productId) {
            const product = getProduct(productId);
            if (!product) {
                showNotification('Товар не найден', 'error');
                return;
            }
            currentProductId = productId;
            document.getElementById('modalProductName').textContent = product.name;
            document.getElementById('modalQuantity').value = 1;
            document.getElementById('quantityModal').classList.add('active');
        }

        // =============================================
        // ЗАКРЫТЬ МОДАЛЬНОЕ ОКНО
        // =============================================
        function closeModal() {
            document.getElementById('quantityModal').classList.remove('active');
            currentProductId = null;
        }

        // =============================================
        // ПОДТВЕРДИТЬ ДОБАВЛЕНИЕ В КОРЗИНУ
        // =============================================
        function confirmAddToCart() {
            if (currentProductId === null) return;
            
            const quantityInput = document.getElementById('modalQuantity');
            const quantity = Number(quantityInput.value);
            
            if (isNaN(quantity) || quantity <= 0) {
                showNotification('Введите корректное количество', 'error');
                return;
            }
            
            const product = getProduct(currentProductId);
            if (!product) {
                showNotification('Товар не найден', 'error');
                closeModal();
                return;
            }
            
            // Добавляем в корзину
            addToCart(currentProductId, quantity);
            showNotification(`${product.name} добавлен в корзину (${quantity} шт.)`, 'success');
            updateCartBadge();
            
            // Закрываем модальное окно
            closeModal();
        }

        // =============================================
        // ЗАКРЫТЬ ПО КЛИКУ НА ОВЕРЛЕЙ
        // =============================================
        document.getElementById('quantityModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // =============================================
        // ЗАКРЫТЬ ПО ESC
        // =============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // =============================================
        // ВЫХОД
        // =============================================
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/market/';
        }

        // =============================================
        // ИНИЦИАЛИЗАЦИЯ
        // =============================================
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if (!user || user.role !== 'user') {
                window.location.href = '/market/';
                return;
            }
            renderCatalog();
            updateCartBadge();
        });
    </script>
</body>
</html>
