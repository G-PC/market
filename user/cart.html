<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #4CAF50;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🛍️ Маркет</div>
        <nav id="mainNav"></nav>
    </header>
    <main>
        <div id="backLinkContainer"></div>
        <h1>🛍️ Корзина</h1>
        <div class="card" id="cartContainer"></div>
    </main>

    <script src="../js/app.js"></script>
    <script>
        // =============================================
        // НАВИГАЦИЯ
        // =============================================
        function renderNavigation() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!user) return;

            const nav = document.getElementById('mainNav');
            const backContainer = document.getElementById('backLinkContainer');

            if (user.role === 'super') {
                backContainer.innerHTML = `<a href="../super/dashboard.html" class="back-link">← Назад в супер-панель</a>`;
                nav.innerHTML = `
                    <a href="../super/dashboard.html">👑 Супер-панель</a>
                    <a href="../admin/products.html">📦 Товары</a>
                    <a href="../admin/orders.html">📋 Заказы</a>
                    <a href="../pvz/dashboard.html">📦 ПВЗ</a>
                    <a href="../catalog.html">🛒 Каталог</a>
                    <a href="cart.html" class="active">🛍️ Корзина <span id="cartCount" class="badge">0</span></a>
                    <a href="profile.html">👤 Профиль</a>
                    <a href="orders.html">📋 Мои заказы</a>
                    <button onclick="showLogoutModal()" class="btn btn-red" style="padding:8px 16px;font-size:14px;">🚪 Выйти</button>
                `;
            } else if (user.role === 'user') {
                nav.innerHTML = `
                    <a href="../catalog.html">🛒 Каталог</a>
                    <a href="cart.html" class="active">🛍️ Корзина <span id="cartCount" class="badge">0</span></a>
                    <a href="profile.html">👤 Профиль</a>
                    <a href="orders.html">📋 Заказы</a>
                    <button onclick="showLogoutModal()" class="btn btn-red" style="padding:8px 16px;font-size:14px;">🚪 Выйти</button>
                `;
            } else if (user.role === 'admin') {
                backContainer.innerHTML = `<a href="../admin/dashboard.html" class="back-link">← Назад в админ-панель</a>`;
                nav.innerHTML = `
                    <a href="../admin/dashboard.html">📊 Дашборд</a>
                    <a href="../admin/products.html">📦 Товары</a>
                    <a href="../admin/orders.html">📋 Заказы</a>
                    <a href="../catalog.html">🛒 Каталог</a>
                    <button onclick="showLogoutModal()" class="btn btn-red" style="padding:8px 16px;font-size:14px;">🚪 Выйти</button>
                `;
            } else if (user.role === 'pvz') {
                backContainer.innerHTML = `<a href="../pvz/dashboard.html" class="back-link">← Назад в панель ПВЗ</a>`;
                nav.innerHTML = `
                    <a href="../pvz/dashboard.html">📊 Панель</a>
                    <a href="../catalog.html">🛒 Каталог</a>
                    <button onclick="showLogoutModal()" class="btn btn-red" style="padding:8px 16px;font-size:14px;">🚪 Выйти</button>
                `;
            }
            updateCartBadge();
        }

        function showLogoutModal() {
            if (confirm('Выйти из аккаунта?')) {
                localStorage.removeItem('currentUser');
                window.location.href = '/market/';
            }
        }

        // =============================================
        // ОТОБРАЖЕНИЕ КОРЗИНЫ
        // =============================================
        function renderCart() {
            const cart = getCart();
            const container = document.getElementById('cartContainer');
            
            if (cart.length === 0) {
                container.innerHTML = `<div class="empty-state"><p>🛒 Корзина пуста</p><a href="../catalog.html" class="btn btn-green">Перейти в каталог</a></div>`;
                updateCartBadge();
                return;
            }
            
            let html = `<h2>Ваши товары</h2><table><thead><tr><th>Товар</th><th>Цена</th><th>Кол-во</th><th>Сумма</th><th></th></tr></thead><tbody>`;
            let total = 0;
            cart.forEach(item => {
                const p = getProduct(item.id);
                if (!p) return;
                const sum = p.price * item.quantity;
                total += sum;
                html += `<tr>
                    <td>${p.name}</td>
                    <td>${p.price.toLocaleString()} ₽</td>
                    <td>
                        <button onclick="updateQty(${item.id}, -1)" class="btn-small">-</button>
                        ${item.quantity}
                        <button onclick="updateQty(${item.id}, 1)" class="btn-small">+</button>
                    </td>
                    <td>${sum.toLocaleString()} ₽</td>
                    <td><button onclick="removeItem(${item.id})" class="btn-small red">🗑️</button></td>
                </tr>`;
            });
            html += `</tbody><tfoot><tr><td colspan="3"><strong>Итого:</strong></td><td colspan="2"><strong>${total.toLocaleString()} ₽</strong></td></tr></tfoot></table>
            <div style="margin-top:15px;display:flex;gap:10px;flex-wrap:wrap;">
                <button onclick="clearCart();renderCart();" class="btn btn-red">🗑️ Очистить</button>
                <button onclick="checkout()" class="btn btn-green">✅ Оформить заказ</button>
            </div>`;
            container.innerHTML = html;
            updateCartBadge();
        }

        function updateQty(productId, delta) {
            const cart = getCart();
            const item = cart.find(i => i.id === productId);
            if (!item) return;
            const newQty = item.quantity + delta;
            if (newQty <= 0) { removeItem(productId); return; }
            item.quantity = newQty;
            saveCart(cart);
            renderCart();
        }

        function removeItem(productId) {
            let cart = getCart();
            cart = cart.filter(i => i.id !== productId);
            saveCart(cart);
            renderCart();
        }

        function checkout() {
            const cart = getCart();
            if (cart.length === 0) { showNotification('Корзина пуста', 'error'); return; }
            const total = cart.reduce((sum, item) => sum + (getProduct(item.id)?.price || 0) * item.quantity, 0);
            if (!confirm(`Оформить заказ на ${total.toLocaleString()} ₽?`)) return;
            
            const items = cart.map(item => ({ id: item.id, quantity: item.quantity }));
            const user = JSON.parse(localStorage.getItem('currentUser'));
            const order = createOrder(user.id, items);
            clearCart();
            renderCart();
            showNotification(`✅ Заказ #${order.id} оформлен! Код получения: ${order.code}`, 'success');
        }

        // =============================================
        // ИНИЦИАЛИЗАЦИЯ
        // =============================================
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if (!user) {
                window.location.href = '/market/';
                return;
            }
            renderNavigation();
            renderCart();
        });
    </script>
</body>
</html>
