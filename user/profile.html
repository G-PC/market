<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #4CAF50;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
        .super-badge {
            display: inline-block;
            background: #9C27B0;
            color: white;
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 12px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🛍️ Маркет</div>
        <nav id="mainNav"></nav>
    </header>
    <main>
        <div id="backLinkContainer"></div>
        <h1>👤 Мой профиль</h1>
        <div class="card">
            <h2>Информация</h2>
            <p><strong>Имя:</strong> <span id="userName"></span></p>
            <p><strong>Email:</strong> <span id="userEmail"></span></p>
            <p><strong>Роль:</strong> <span id="userRole"></span></p>
        </div>
        <div class="card">
            <h2>📊 Статистика</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="number" id="ordersCount">0</div>
                    <div class="label">Заказов</div>
                </div>
                <div class="stat-item">
                    <div class="number" id="totalSpent">0</div>
                    <div class="label">Потрачено (₽)</div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script>
        // =============================================
        // НАВИГАЦИЯ
        // =============================================
        function renderNavigation() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!user) return;

            const nav = document.getElementById('mainNav');
            const backContainer = document.getElementById('backLinkContainer');

            if (user.role === 'super') {
                backContainer.innerHTML = `<a href="../super/dashboard.html" class="back-link">← Назад в супер-панель</a>`;
                nav.innerHTML = `
                    <a href="../super/dashboard.html">👑 Супер-панель</a>
                    <a href="../admin/products.html">📦 Товары</a>
                    <a href="../admin/orders.html">📋 Заказы</a>
                    <a href="../pvz/dashboard.html">📦 ПВЗ</a>
                    <a href="../catalog.html">🛒 Каталог</a>
                    <a href="cart.html">🛍️ Корзина <span id="cartCount" class="badge">0</span></a>
                    <a href="profile.html" class="active">👤 Профиль</a>
                    <a href="orders.html">📋 Мои заказы</a>
                    <button onclick="showLogoutModal()" class="btn btn-red" style="padding:8px 16px;font-size:14px;">🚪 Выйти</button>
                `;
            } else if (user.role === 'user') {
                nav.innerHTML = `
                    <a href="../catalog.html">🛒 Каталог</a>
                    <a href="cart.html">🛍️ Корзина <span id="cartCount" class="badge">0</span></a>
                    <a href="profile.html" class="active">👤 Профиль</a>
                    <a href="orders.html">📋 Заказы</a>
                    <button onclick="showLogoutModal()" class="btn btn-red" style="padding:8px 16px;font-size:14px;">🚪 Выйти</button>
                `;
            } else if (user.role === 'admin') {
                backContainer.innerHTML = `<a href="../admin/dashboard.html" class="back-link">← Назад в админ-панель</a>`;
                nav.innerHTML = `
                    <a href="../admin/dashboard.html">📊 Дашборд</a>
                    <a href="../admin/products.html">📦 Товары</a>
                    <a href="../admin/orders.html">📋 Заказы</a>
                    <a href="../catalog.html">🛒 Каталог</a>
                    <button onclick="showLogoutModal()" class="btn btn-red" style="padding:8px 16px;font-size:14px;">🚪 Выйти</button>
                `;
            } else if (user.role === 'pvz') {
                backContainer.innerHTML = `<a href="../pvz/dashboard.html" class="back-link">← Назад в панель ПВЗ</a>`;
                nav.innerHTML = `
                    <a href="../pvz/dashboard.html">📊 Панель</a>
                    <a href="../catalog.html">🛒 Каталог</a>
                    <button onclick="showLogoutModal()" class="btn btn-red" style="padding:8px 16px;font-size:14px;">🚪 Выйти</button>
                `;
            }
            updateCartBadge();
        }

        function showLogoutModal() {
            if (confirm('Выйти из аккаунта?')) {
                localStorage.removeItem('currentUser');
                window.location.href = '/market/';
            }
        }

        function loadProfile() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userEmail').textContent = user.email;
            
            let roleText = user.role === 'admin' ? 'Администратор' : 
                          user.role === 'pvz' ? 'Сотрудник ПВЗ' : 
                          user.role === 'super' ? 'Суперпользователь 👑' : 'Пользователь';
            document.getElementById('userRole').innerHTML = roleText + (user.role === 'super' ? ' <span class="super-badge">SUPER</span>' : '');
            
            const userOrders = getUserOrders(user.id);
            document.getElementById('ordersCount').textContent = userOrders.length;
            document.getElementById('totalSpent').textContent = userOrders.reduce((sum, o) => sum + o.total, 0).toLocaleString();
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if (!user) {
                window.location.href = '/market/';
                return;
            }
            renderNavigation();
            loadProfile();
        });
    </script>
</body>
</html>
