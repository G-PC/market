<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="logo">🛍️ Маркет</div>
        <nav>
            <a href="../catalog.html">🛒 Каталог</a>
            <a href="cart.html">🛍️ Корзина <span id="cartCount" class="badge">0</span></a>
            <a href="profile.html" class="active">👤 Профиль</a>
            <a href="orders.html">📋 Заказы</a>
            <button onclick="logout()" class="btn btn-red">🚪 Выйти</button>
        </nav>
    </header>
    <main>
        <h1>👤 Мой профиль</h1>
        <div class="card">
            <h2>Информация</h2>
            <p><strong>Имя:</strong> <span id="userName"></span></p>
            <p><strong>Email:</strong> <span id="userEmail"></span></p>
            <p><strong>Роль:</strong> <span id="userRole"></span></p>
        </div>
        <div class="card">
            <h2>📊 Статистика</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="number" id="ordersCount">0</div>
                    <div class="label">Заказов</div>
                </div>
                <div class="stat-item">
                    <div class="number" id="totalSpent">0</div>
                    <div class="label">Потрачено (₽)</div>
                </div>
            </div>
        </div>
    </main>
    <script src="../js/app.js"></script>
    <script>
        function loadProfile() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userRole').textContent = user.role === 'admin' ? 'Администратор' : user.role === 'pvz' ? 'Сотрудник ПВЗ' : 'Пользователь';
            
            const userOrders = getUserOrders(user.id);
            document.getElementById('ordersCount').textContent = userOrders.length;
            document.getElementById('totalSpent').textContent = userOrders.reduce((sum, o) => sum + o.total, 0).toLocaleString();
            updateCartBadge();
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/market/';
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if (!user || user.role !== 'user') { window.location.href = '/market/'; return; }
            loadProfile();
        });
    </script>
</body>
</html>
