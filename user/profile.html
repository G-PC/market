<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #4CAF50;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
        .super-badge {
            display: inline-block;
            background: #9C27B0;
            color: white;
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 12px;
            margin-left: 8px;
        }
        .modal-overlay {
            position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;justify-content:center;align-items:center;z-index:10000;
        }
        .modal-overlay.active { display:flex; }
        .modal-box {
            background:white;border-radius:16px;padding:30px;max-width:400px;width:90%;text-align:center;animation:scaleIn 0.3s ease;
        }
        .modal-box .icon { font-size:48px;margin-bottom:10px; }
        .modal-box h3 { font-size:20px;margin-bottom:8px;color:#333; }
        .modal-box p { color:#666;font-size:14px;margin-bottom:20px; }
        .modal-actions { display:flex;gap:10px; }
        .modal-actions .btn { flex:1;padding:12px;border:none;border-radius:8px;font-size:16px;cursor:pointer;font-weight:500;color:white; }
        .modal-actions .btn-cancel { background:#e0e0e0;color:#333; }
        .modal-actions .btn-danger { background:#f44336; }
        .modal-actions .btn-danger:hover { background:#d32f2f; }
        @keyframes scaleIn {
            from { transform:scale(0.9); opacity:0; }
            to { transform:scale(1); opacity:1; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🛍️ Маркет</div>
        <nav>
            <a href="../super/dashboard.html">👑 Супер</a>
            <a href="../catalog.html">🛒 Каталог</a>
            <a href="cart.html">🛍️ Корзина <span id="cartCount" class="badge">0</span></a>
            <a href="profile.html" class="active">👤 Профиль</a>
            <a href="orders.html">📋 Заказы</a>
            <button onclick="showLogoutModal()" class="btn btn-red" style="padding:8px 16px;font-size:14px;">🚪 Выйти</button>
        </nav>
    </header>
    <main>
        <a href="../super/dashboard.html" class="back-link">← Назад в супер-панель</a>
        <h1>👤 Мой профиль</h1>
        <div class="card">
            <h2>Информация</h2>
            <p><strong>Имя:</strong> <span id="userName"></span></p>
            <p><strong>Email:</strong> <span id="userEmail"></span></p>
            <p><strong>Роль:</strong> <span id="userRole"></span></p>
        </div>
        <div class="card">
            <h2>📊 Статистика</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="number" id="ordersCount">0</div>
                    <div class="label">Заказов</div>
                </div>
                <div class="stat-item">
                    <div class="number" id="totalSpent">0</div>
                    <div class="label">Потрачено (₽)</div>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== МОДАЛЬНОЕ ОКНО ДЛЯ ВЫХОДА ===== -->
    <div class="modal-overlay" id="logoutModal">
        <div class="modal-box">
            <div class="icon">🚪</div>
            <h3>Выход из аккаунта</h3>
            <p>Вы уверены, что хотите выйти?</p>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="document.getElementById('logoutModal').style.display='none'">Отмена</button>
                <button class="btn btn-danger" onclick="logout()">Выйти</button>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        function showLogoutModal() {
            document.getElementById('logoutModal').style.display = 'flex';
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/market/';
        }

        function loadProfile() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userEmail').textContent = user.email;
            
            let roleText = user.role === 'admin' ? 'Администратор' : 
                          user.role === 'pvz' ? 'Сотрудник ПВЗ' : 
                          user.role === 'super' ? 'Суперпользователь 👑' : 'Пользователь';
            document.getElementById('userRole').innerHTML = roleText + (user.role === 'super' ? ' <span class="super-badge">SUPER</span>' : '');
            
            const userOrders = getUserOrders(user.id);
            document.getElementById('ordersCount').textContent = userOrders.length;
            document.getElementById('totalSpent').textContent = userOrders.reduce((sum, o) => sum + o.total, 0).toLocaleString();
            updateCartBadge();
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if (!user) {
                window.location.href = '/market/';
                return;
            }
            loadProfile();
        });
    </script>
</body>
</html>
