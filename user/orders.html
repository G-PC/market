<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои заказы</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #4CAF50;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
        .order-code {
            display: inline-block;
            background: #4CAF50;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 4px 16px;
            border-radius: 6px;
            letter-spacing: 2px;
            font-family: monospace;
        }
        .order-code-container {
            margin: 8px 0;
        }
        .order-code-label {
            font-size: 13px;
            color: #666;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: scaleIn 0.3s ease;
        }
        .modal-box .icon { font-size: 48px; margin-bottom: 10px; }
        .modal-box h3 { font-size: 20px; margin-bottom: 8px; color: #333; }
        .modal-box p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 500; color: white; }
        .modal-actions .btn-cancel { background: #e0e0e0; color: #333; }
        .modal-actions .btn-danger { background: #f44336; }
        .modal-actions .btn-danger:hover { background: #d32f2f; }
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .code-copy {
            background: #f0f0f0;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-block;
            transition: 0.3s;
            font-family: monospace;
            font-size: 20px;
            font-weight: bold;
            color: #4CAF50;
            letter-spacing: 3px;
        }
        .code-copy:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🛍️ Маркет</div>
        <nav>
            <a href="../super/dashboard.html">👑 Супер</a>
            <a href="../catalog.html">🛒 Каталог</a>
            <a href="cart.html">🛍️ Корзина <span id="cartCount" class="badge">0</span></a>
            <a href="profile.html">👤 Профиль</a>
            <a href="orders.html" class="active">📋 Заказы</a>
            <button onclick="showLogoutModal()" class="btn btn-red" style="padding:8px 16px;font-size:14px;">🚪 Выйти</button>
        </nav>
    </header>
    <main>
        <a href="../super/dashboard.html" class="back-link">← Назад в супер-панель</a>
        <h1>📋 Мои заказы</h1>
        <div class="card" id="ordersContainer"></div>
    </main>

    <!-- ===== МОДАЛЬНОЕ ОКНО ДЛЯ ВЫХОДА ===== -->
    <div class="modal-overlay" id="logoutModal">
        <div class="modal-box">
            <div class="icon">🚪</div>
            <h3>Выход из аккаунта</h3>
            <p>Вы уверены, что хотите выйти?</p>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="document.getElementById('logoutModal').style.display='none'">Отмена</button>
                <button class="btn btn-danger" onclick="logout()">Выйти</button>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        function showLogoutModal() {
            document.getElementById('logoutModal').style.display = 'flex';
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/market/';
        }

        function copyCode(code) {
            navigator.clipboard.writeText(code).then(() => {
                showNotification('✅ Код скопирован!', 'success');
            }).catch(() => {
                // Fallback
                const input = document.createElement('input');
                input.value = code;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                input.remove();
                showNotification('✅ Код скопирован!', 'success');
            });
        }

        function renderOrders() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!user) {
                window.location.href = '/market/';
                return;
            }

            const userOrders = getUserOrders(user.id);
            const container = document.getElementById('ordersContainer');
            
            if (userOrders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>📋 У вас пока нет заказов</p>
                        <a href="../catalog.html" class="btn btn-green">Перейти в каталог</a>
                    </div>
                `;
                return;
            }
            
            const statusLabels = { 
                'new': '🆕 Новый', 
                'processing': '⚙️ В обработке', 
                'delivery': '🚚 В доставке', 
                'pvz': '📦 В ПВЗ (готов к выдаче)', 
                'completed': '✅ Выдан' 
            };
            
            let html = `<h2>Все заказы (${userOrders.length})</h2>`;
            
            [...userOrders].sort((a, b) => b.id - a.id).forEach(o => {
                const productsList = o.products.map(item => {
                    const p = getProduct(item.id);
                    return `${p ? p.name : 'Товар удален'} × ${item.quantity}`;
                }).join(', ');
                
                // Показываем код только если заказ в ПВЗ или выдан
                let codeHtml = '';
                if (o.status === 'pvz' || o.status === 'completed') {
                    codeHtml = `
                        <div class="order-code-container">
                            <span class="order-code-label">🔑 Код получения:</span>
                            <div style="margin-top:4px;">
                                <span class="code-copy" onclick="copyCode('${o.code}')" title="Нажмите чтобы скопировать">
                                    ${o.code}
                                </span>
                                <span style="font-size:12px;color:#999;margin-left:8px;">(нажмите для копирования)</span>
                            </div>
                        </div>
                    `;
                }
                
                html += `
                    <div class="order-card">
                        <div class="header">
                            <span class="id">Заказ #${o.id}</span>
                            <span class="date">📅 ${o.date}</span>
                            <span class="status status-${o.status}">${statusLabels[o.status] || o.status}</span>
                        </div>
                        <div><strong>Товары:</strong> ${productsList}</div>
                        <div class="total">💰 ${o.total.toLocaleString()} ₽</div>
                        ${codeHtml}
                    </div>
                `;
            });
            
            container.innerHTML = html;
            updateCartBadge();
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if (!user || (user.role !== 'user' && user.role !== 'super')) {
                window.location.href = '/market/';
                return;
            }
            renderOrders();
            updateCartBadge();
        });
    </script>
</body>
</html>
