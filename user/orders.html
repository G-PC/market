<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои заказы</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #4CAF50;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
        
        .order-code-container {
            margin: 10px 0;
            padding: 10px;
            background: #f0f8f0;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }
        .order-code-label {
            font-size: 13px;
            color: #555;
            font-weight: 500;
        }
        .order-code-value {
            font-size: 28px;
            font-weight: bold;
            color: #4CAF50;
            letter-spacing: 4px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            user-select: all;
            padding: 4px 12px;
            background: white;
            border-radius: 6px;
            display: inline-block;
            border: 2px dashed #4CAF50;
            transition: 0.3s;
        }
        .order-code-value:hover {
            background: #e8f5e9;
            border-color: #2e7d32;
        }
        .order-code-hint {
            font-size: 12px;
            color: #999;
            margin-left: 10px;
        }
        .status-ready {
            background: #4CAF50;
            color: white;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🛍️ Маркет</div>
        <nav id="mainNav"></nav>
    </header>
    <main>
        <div id="backLinkContainer"></div>
        <h1>📋 Мои заказы</h1>
        
        <div style="background:#e3f2fd;padding:12px 16px;border-radius:8px;margin-bottom:20px;border-left:4px solid #2196F3;">
            <p style="margin:0;font-size:14px;color:#0d47a1;">
                🔑 <strong>Код получения</strong> — покажите этот код сотруднику ПВЗ, чтобы получить заказ.
                Код действителен, когда заказ имеет статус <strong>"В ПВЗ"</strong>.
            </p>
        </div>

        <div class="card" id="ordersContainer"></div>
    </main>

    <script src="../js/app.js"></script>
    <script>
        // =============================================
        // НАВИГАЦИЯ
        // =============================================
        function renderNavigation() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!user) return;

            const nav = document.getElementById('mainNav');
            const backContainer = document.getElementById('backLinkContainer');

            if (user.role === 'super') {
                backContainer.innerHTML = `<a href="../super/dashboard.html" class="back-link">← Назад в супер-панель</a>`;
                nav.innerHTML = `
                    <a href="../super/dashboard.html">👑 Супер-панель</a>
                    <a href="../admin/products.html">📦 Товары</a>
                    <a href="../admin/orders.html">📋 Заказы</a>
                    <a href="../pvz/dashboard.html">📦 ПВЗ</a>
                    <a href="../catalog.html">🛒 Каталог</a>
                    <a href="cart.html">🛍️ Корзина <span id="cartCount" class="badge">0</span></a>
                    <a href="profile.html">👤 Профиль</a>
                    <a href="orders.html" class="active">📋 Мои заказы</a>
                    <button onclick="showLogoutModal()" class="btn btn-red" style="padding:8px 16px;font-size:14px;">🚪 Выйти</button>
                `;
            } else if (user.role === 'user') {
                nav.innerHTML = `
                    <a href="../catalog.html">🛒 Каталог</a>
                    <a href="cart.html">🛍️ Корзина <span id="cartCount" class="badge">0</span></a>
                    <a href="profile.html">👤 Профиль</a>
                    <a href="orders.html" class="active">📋 Заказы</a>
                    <button onclick="showLogoutModal()" class="btn btn-red" style="padding:8px 16px;font-size:14px;">🚪 Выйти</button>
                `;
            } else if (user.role === 'admin') {
                backContainer.innerHTML = `<a href="../admin/dashboard.html" class="back-link">← Назад в админ-панель</a>`;
                nav.innerHTML = `
                    <a href="../admin/dashboard.html">📊 Дашборд</a>
                    <a href="../admin/products.html">📦 Товары</a>
                    <a href="../admin/orders.html">📋 Заказы</a>
                    <a href="../catalog.html">🛒 Каталог</a>
                    <button onclick="showLogoutModal()" class="btn btn-red" style="padding:8px 16px;font-size:14px;">🚪 Выйти</button>
                `;
            } else if (user.role === 'pvz') {
                backContainer.innerHTML = `<a href="../pvz/dashboard.html" class="back-link">← Назад в панель ПВЗ</a>`;
                nav.innerHTML = `
                    <a href="../pvz/dashboard.html">📊 Панель</a>
                    <a href="../catalog.html">🛒 Каталог</a>
                    <button onclick="showLogoutModal()" class="btn btn-red" style="padding:8px 16px;font-size:14px;">🚪 Выйти</button>
                `;
            }
            updateCartBadge();
        }

        function showLogoutModal() {
            if (confirm('Выйти из аккаунта?')) {
                localStorage.removeItem('currentUser');
                window.location.href = '/market/';
            }
        }

        function copyCode(code) {
            navigator.clipboard.writeText(code).then(() => {
                showNotification('✅ Код скопирован!', 'success');
            }).catch(() => {
                const input = document.createElement('input');
                input.value = code;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                input.remove();
                showNotification('✅ Код скопирован!', 'success');
            });
        }

        // =============================================
        // ОТОБРАЖЕНИЕ ЗАКАЗОВ
        // =============================================
        function renderOrders() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!user) {
                window.location.href = '/market/';
                return;
            }

            const userOrders = getUserOrders(user.id);
            const container = document.getElementById('ordersContainer');
            
            if (userOrders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>📋 У вас пока нет заказов</p>
                        <a href="../catalog.html" class="btn btn-green">Перейти в каталог</a>
                    </div>
                `;
                updateCartBadge();
                return;
            }
            
            const statusLabels = { 
                'new': '🆕 Новый', 
                'processing': '⚙️ В обработке', 
                'delivery': '🚚 В доставке', 
                'pvz': '📦 В ПВЗ (готов к выдаче)', 
                'completed': '✅ Выдан' 
            };
            
            let html = `<h2>Все заказы (${userOrders.length})</h2>`;
            
            [...userOrders].sort((a, b) => b.id - a.id).forEach(o => {
                const productsList = o.products.map(item => {
                    const p = getProduct(item.id);
                    return `${p ? p.name : 'Товар удален'} × ${item.quantity}`;
                }).join(', ');
                
                const isReady = o.status === 'pvz';
                
                html += `
                    <div class="order-card" style="${isReady ? 'border-left-color: #4CAF50; border-left-width: 6px;' : ''}">
                        <div class="header">
                            <span class="id">Заказ #${o.id}</span>
                            <span class="date">📅 ${o.date}</span>
                            <span class="status status-${o.status}">${statusLabels[o.status] || o.status}</span>
                            ${isReady ? '<span class="status-ready">✅ ГОТОВ К ВЫДАЧЕ</span>' : ''}
                        </div>
                        <div><strong>Товары:</strong> ${productsList}</div>
                        <div class="total">💰 ${o.total.toLocaleString()} ₽</div>
                        
                        <div class="order-code-container">
                            <div class="order-code-label">🔑 Код получения заказа:</div>
                            <div style="display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:4px;">
                                <span class="order-code-value" onclick="copyCode('${o.code}')" title="Нажмите чтобы скопировать">
                                    ${o.code}
                                </span>
                                <span class="order-code-hint">(нажмите на код, чтобы скопировать)</span>
                                ${isReady ? '<span style="color:#4CAF50;font-weight:500;">✅ Действителен</span>' : '<span style="color:#FF9800;font-weight:500;">⏳ Ожидайте готовности</span>'}
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            updateCartBadge();
        }

        // =============================================
        // ИНИЦИАЛИЗАЦИЯ
        // =============================================
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if (!user) {
                window.location.href = '/market/';
                return;
            }
            renderNavigation();
            renderOrders();
        });
    </script>
</body>
</html>
