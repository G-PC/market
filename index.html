<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маркет - Вход</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            background: #e0e0e0;
            transition: 0.3s;
            font-weight: 500;
        }
        .tab.active {
            background: #4CAF50;
            color: white;
        }
        .tab:hover:not(.active) {
            background: #d0d0d0;
        }
        .form {
            display: none;
        }
        .form.active {
            display: block;
        }
        .quick-login {
            margin-top: 15px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            text-align: center;
        }
        .quick-login .btn {
            margin-top: 8px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🛍️</div>
        <h1>Маркет</h1>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">🔑 Вход</button>
            <button class="tab" onclick="switchTab('register')">📝 Регистрация</button>
        </div>

        <!-- ВХОД -->
        <div class="form active" id="loginForm">
            <h2>Вход в систему</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="loginEmail" value="admin@mail.ru" required>
                </div>
                <div class="form-group">
                    <label>🔒 Пароль</label>
                    <input type="password" id="loginPassword" value="123456" required>
                </div>
                <button type="submit" class="btn btn-green">🔑 Войти</button>
            </form>
            <div class="demo">
                <p><strong>📌 Демо-аккаунты:</strong></p>
                <p>👑 Админ: admin@mail.ru / 123456</p>
                <p>👤 Пользователь: user@mail.ru / 123456</p>
                <p>📦 ПВЗ: pvz@mail.ru / 123456</p>
            </div>
        </div>

        <!-- РЕГИСТРАЦИЯ -->
        <div class="form" id="registerForm">
            <h2>📝 Создать аккаунт</h2>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>👤 Имя</label>
                    <input type="text" id="registerName" placeholder="Иван Петров" required>
                </div>
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="registerEmail" placeholder="example@mail.ru" required>
                </div>
                <div class="form-group">
                    <label>🔒 Пароль</label>
                    <input type="password" id="registerPassword" placeholder="Минимум 6 символов" minlength="6" required>
                </div>
                <div class="form-group">
                    <label>🎭 Роль</label>
                    <select id="registerRole">
                        <option value="user">👤 Пользователь</option>
                        <option value="pvz">📦 Сотрудник ПВЗ</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-green">✅ Создать аккаунт</button>
            </form>
            <div style="margin-top:15px;text-align:center;font-size:13px;color:#666;">
                Уже есть аккаунт? <a href="#" onclick="switchTab('login')" style="color:#4CAF50;">Войти</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.getElementById(tab === 'login' ? 'loginForm' : 'registerForm').classList.add('active');
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const user = users.find(u => u.email === email && u.password === password);
            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                localStorage.setItem('products', JSON.stringify(products));
                showNotification('✅ Добро пожаловать, ' + user.name + '!', 'success');
                setTimeout(() => {
                    window.location.href = user.role === 'admin' ? '/market/admin/dashboard.html' :
                                          user.role === 'pvz' ? '/market/pvz/dashboard.html' :
                                          '/market/user/profile.html';
                }, 500);
            } else {
                showNotification('❌ Неверный email или пароль!', 'error');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const role = document.getElementById('registerRole').value;

            if (!name || !email || !password) {
                showNotification('Заполните все поля!', 'error');
                return;
            }
            if (password.length < 6) {
                showNotification('Пароль должен быть минимум 6 символов!', 'error');
                return;
            }
            if (users.find(u => u.email === email)) {
                showNotification('❌ Пользователь уже существует!', 'error');
                return;
            }

            const newUser = { id: nextUserId++, name, email, password, role };
            users.push(newUser);
            saveUsers();
            showNotification('✅ Аккаунт создан! Войдите.', 'success');
            switchTab('login');
            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = '';
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            const saved = localStorage.getItem('currentUser');
            if (saved) {
                try {
                    const user = JSON.parse(saved);
                    const exists = users.find(u => u.email === user.email);
                    if (exists) {
                        const panel = document.createElement('div');
                        panel.className = 'quick-login';
                        panel.innerHTML = `
                            <p>👋 Вы уже авторизованы как <strong>${exists.name}</strong></p>
                            <button onclick="window.location.href='/market/${exists.role}/dashboard.html'" class="btn btn-blue">Продолжить</button>
                            <button onclick="localStorage.removeItem('currentUser');location.reload();" class="btn btn-red">Выйти</button>
                        `;
                        document.querySelector('.form').after(panel);
                    }
                } catch (e) {}
            }
            console.log('🛍️ Маркет загружен!');
            console.log('👥 Пользователей:', users.length);
            console.log('📦 Товаров:', products.length);
        });
    </script>
</body>
</html>
