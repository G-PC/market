<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маркет - Вход</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            background: #e0e0e0;
            transition: 0.3s;
            font-weight: 500;
        }
        .tab.active {
            background: #4CAF50;
            color: white;
        }
        .tab:hover:not(.active) {
            background: #d0d0d0;
        }
        .form {
            display: none;
        }
        .form.active {
            display: block;
        }
        .quick-login {
            margin-top: 15px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            text-align: center;
        }
        .quick-login .btn {
            margin-top: 8px;
            width: 100%;
        }
        .super-badge {
            display: inline-block;
            background: #9C27B0;
            color: white;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 5px;
        }
        .login-hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
            text-align: center;
        }
        .login-hint span {
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🛍️</div>
        <h1>Маркет</h1>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">🔑 Вход</button>
            <button class="tab" onclick="switchTab('register')">📝 Регистрация</button>
        </div>

        <!-- ===== ВХОД ===== -->
        <div class="form active" id="loginForm">
            <h2>Вход в систему</h2>
            <form id="loginFormSubmit">
                <div class="form-group">
                    <label>📧 Email или логин</label>
                    <input type="text" id="loginEmail" placeholder="example@mail.ru или admin" value="admin" required>
                </div>
                <div class="form-group">
                    <label>🔒 Пароль</label>
                    <input type="password" id="loginPassword" placeholder="Введите пароль" value="123456" required>
                </div>
                <button type="submit" class="btn btn-green" id="loginBtn">🔑 Войти</button>
            </form>
            <div class="login-hint">
                💡 Можно ввести <span>email</span> (admin@mail.ru) или <span>логин</span> (admin)
            </div>
        </div>

        <!-- ===== РЕГИСТРАЦИЯ ===== -->
        <div class="form" id="registerForm">
            <h2>📝 Создать аккаунт</h2>
            <form id="registerFormSubmit">
                <div class="form-group">
                    <label>👤 Имя</label>
                    <input type="text" id="registerName" placeholder="Иван Петров" required>
                </div>
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="registerEmail" placeholder="example@mail.ru" required>
                </div>
                <div class="form-group">
                    <label>🔒 Пароль</label>
                    <input type="password" id="registerPassword" placeholder="Минимум 6 символов" minlength="6" required>
                </div>
                <div class="form-group">
                    <label>🎭 Роль</label>
                    <select id="registerRole">
                        <option value="user">👤 Пользователь</option>
                        <option value="pvz">📦 Сотрудник ПВЗ</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-green">✅ Создать аккаунт</button>
            </form>
            <div style="margin-top:15px;text-align:center;font-size:13px;color:#666;">
                Уже есть аккаунт? <a href="#" onclick="switchTab('login')" style="color:#4CAF50;">Войти</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // =============================================
        // ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
        // =============================================
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.getElementById(tab === 'login' ? 'loginForm' : 'registerForm').classList.add('active');
        }

        // =============================================
        // ПОИСК ПОЛЬЗОВАТЕЛЯ ПО EMAIL ИЛИ ЛОГИНУ
        // =============================================
        function findUserByEmailOrLogin(input, password) {
            input = input.trim().toLowerCase();
            
            let user = users.find(u => u.email.toLowerCase() === input && u.password === password);
            if (user) return user;
            
            user = users.find(u => {
                const login = u.email.split('@')[0].toLowerCase();
                return login === input && u.password === password;
            });
            
            return user;
        }

        // =============================================
        // ВХОД
        // =============================================
        document.getElementById('loginFormSubmit').addEventListener('submit', function(e) {
            e.preventDefault();

            const input = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            btn.innerHTML = '⏳ Вход...';
            btn.disabled = true;

            const user = findUserByEmailOrLogin(input, password);

            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                localStorage.setItem('products', JSON.stringify(products));
                showNotification('✅ Добро пожаловать, ' + user.name + '!', 'success');
                
                btn.innerHTML = '🔑 Войти';
                btn.disabled = false;

                setTimeout(() => {
                    if (user.role === 'super') {
                        window.location.href = '/market/super/dashboard.html';
                    } else if (user.role === 'admin') {
                        window.location.href = '/market/admin/dashboard.html';
                    } else if (user.role === 'pvz') {
                        window.location.href = '/market/pvz/dashboard.html';
                    } else {
                        window.location.href = '/market/user/profile.html';
                    }
                }, 500);
            } else {
                showNotification('❌ Неверный email/логин или пароль!', 'error');
                btn.innerHTML = '🔑 Войти';
                btn.disabled = false;
            }
        });

        // =============================================
        // РЕГИСТРАЦИЯ
        // =============================================
        document.getElementById('registerFormSubmit').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const role = document.getElementById('registerRole').value;

            if (!name || !email || !password) {
                showNotification('Заполните все поля!', 'error');
                return;
            }
            if (password.length < 6) {
                showNotification('Пароль должен быть минимум 6 символов!', 'error');
                return;
            }
            if (users.find(u => u.email.toLowerCase() === email.toLowerCase())) {
                showNotification('❌ Пользователь с таким email уже существует!', 'error');
                return;
            }

            const newUser = { 
                id: nextUserId++, 
                name, 
                email: email.toLowerCase(), 
                password, 
                role: role || 'user' 
            };
            users.push(newUser);
            saveUsers();
            
            showNotification('✅ Аккаунт создан! Войдите.', 'success');
            switchTab('login');
            document.getElementById('loginEmail').value = email.split('@')[0];
            document.getElementById('loginPassword').value = '';
            document.getElementById('registerName').value = '';
            document.getElementById('registerPassword').value = '';
        });

        // =============================================
        // ПРОВЕРКА АВТОРИЗАЦИИ
        // =============================================
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            
            const saved = localStorage.getItem('currentUser');
            if (saved) {
                try {
                    const user = JSON.parse(saved);
                    const exists = users.find(u => u.id === user.id);
                    if (exists) {
                        const panel = document.createElement('div');
                        panel.className = 'quick-login';
                        panel.innerHTML = `
                            <p>👋 Вы уже авторизованы как <strong>${exists.name}</strong>
                            ${exists.role === 'super' ? '<span class="super-badge">👑 SUPER</span>' : ''}
                            </p>
                            <button onclick="goToDashboard()" class="btn btn-blue">Продолжить</button>
                            <button onclick="logout()" class="btn btn-red">Выйти</button>
                        `;
                        document.querySelector('.form').after(panel);
                    }
                } catch (e) {}
            }

            console.log('🛍️ Маркет загружен!');
            console.log('👥 Пользователей:', users.length);
            console.log('📦 Товаров:', products.length);
            console.log('📋 Заказов:', orders.length);
        });

        // =============================================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // =============================================
        function goToDashboard() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (user.role === 'super') {
                window.location.href = '/market/super/dashboard.html';
            } else if (user.role === 'admin') {
                window.location.href = '/market/admin/dashboard.html';
            } else if (user.role === 'pvz') {
                window.location.href = '/market/pvz/dashboard.html';
            } else {
                window.location.href = '/market/user/profile.html';
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            location.reload();
        }
    </script>
</body>
</html>
