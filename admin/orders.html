<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление заказами</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="logo">🛍️ Маркет</div>
        <nav>
            <a href="dashboard.html">📊 Дашборд</a>
            <a href="products.html">📦 Товары</a>
            <a href="orders.html" class="active">📋 Заказы</a>
            <button onclick="logout()" class="btn btn-red">🚪 Выйти</button>
        </nav>
    </header>
    <main>
        <h1>📋 Управление заказами</h1>
        <div class="card">
            <table>
                <thead><tr><th>№</th><th>Пользователь</th><th>Товары</th><th>Сумма</th><th>Статус</th><th>Действия</th></tr></thead>
                <tbody id="ordersTable"></tbody>
            </table>
        </div>
    </main>
    <script src="../js/app.js"></script>
    <script>
        function renderOrders() {
            const tbody = document.getElementById('ordersTable');
            const statuses = ['new', 'processing', 'delivery', 'pvz', 'completed'];
            const statusLabels = { 'new': 'Новый', 'processing': 'В обработке', 'delivery': 'Доставка', 'pvz': 'В ПВЗ', 'completed': 'Выполнен' };
            
            tbody.innerHTML = [...orders].sort((a, b) => b.id - a.id).map(o => {
                const user = users.find(u => u.id === o.userId);
                const productsList = o.products.map(item => {
                    const p = getProduct(item.id);
                    return `${p ? p.name : 'Товар'} × ${item.quantity}`;
                }).join(', ');
                return `
                    <tr>
                        <td>#${o.id}</td>
                        <td>${user ? user.name : 'Неизвестно'}</td>
                        <td>${productsList}</td>
                        <td>${o.total.toLocaleString()} ₽</td>
                        <td><span class="status status-${o.status}">${statusLabels[o.status] || o.status}</span></td>
                        <td>
                            <select onchange="changeStatus(${o.id}, this.value)" style="padding:5px;border-radius:4px;border:1px solid #ddd;">
                                ${statuses.map(s => `<option value="${s}" ${s === o.status ? 'selected' : ''}>${statusLabels[s]}</option>`).join('')}
                            </select>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function changeStatus(orderId, status) {
            if (updateOrderStatus(orderId, status)) {
                renderOrders();
                showNotification('✅ Статус обновлён!', 'success');
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/market/';
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if (!user || user.role !== 'admin') { window.location.href = '/market/'; return; }
            renderOrders();
        });
    </script>
</body>
</html>
