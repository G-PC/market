<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление заказами</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #4CAF50;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
        .modal-overlay {
            position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;justify-content:center;align-items:center;z-index:10000;
        }
        .modal-overlay.active { display:flex; }
        .modal-box {
            background:white;border-radius:16px;padding:30px;max-width:400px;width:90%;text-align:center;animation:scaleIn 0.3s ease;
        }
        .modal-box .icon { font-size:48px;margin-bottom:10px; }
        .modal-box h3 { font-size:20px;margin-bottom:8px;color:#333; }
        .modal-box p { color:#666;font-size:14px;margin-bottom:20px; }
        .modal-actions { display:flex;gap:10px; }
        .modal-actions .btn { flex:1;padding:12px;border:none;border-radius:8px;font-size:16px;cursor:pointer;font-weight:500;color:white; }
        .modal-actions .btn-cancel { background:#e0e0e0;color:#333; }
        .modal-actions .btn-danger { background:#f44336; }
        .modal-actions .btn-danger:hover { background:#d32f2f; }
        @keyframes scaleIn {
            from { transform:scale(0.9); opacity:0; }
            to { transform:scale(1); opacity:1; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🛍️ Маркет</div>
        <nav>
            <a href="../super/dashboard.html">👑 Супер</a>
            <a href="products.html">📦 Товары</a>
            <a href="orders.html" class="active">📋 Заказы</a>
            <button onclick="showLogoutModal()" class="btn btn-red" style="padding:8px 16px;font-size:14px;">🚪 Выйти</button>
        </nav>
    </header>
    <main>
        <a href="../super/dashboard.html" class="back-link">← Назад в супер-панель</a>
        <h1>📋 Управление заказами</h1>
        <div class="card">
            <table>
                <thead><tr><th>№</th><th>Пользователь</th><th>Товары</th><th>Сумма</th><th>Статус</th><th>Действия</th></tr></thead>
                <tbody id="ordersTable"></tbody>
            </table>
        </div>
    </main>

    <!-- ===== МОДАЛЬНОЕ ОКНО ДЛЯ ВЫХОДА ===== -->
    <div class="modal-overlay" id="logoutModal">
        <div class="modal-box">
            <div class="icon">🚪</div>
            <h3>Выход из аккаунта</h3>
            <p>Вы уверены, что хотите выйти?</p>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="document.getElementById('logoutModal').style.display='none'">Отмена</button>
                <button class="btn btn-danger" onclick="logout()">Выйти</button>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        function showLogoutModal() {
            document.getElementById('logoutModal').style.display = 'flex';
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/market/';
        }

        function renderOrders() {
            const tbody = document.getElementById('ordersTable');
            const statuses = ['new', 'processing', 'delivery', 'pvz', 'completed'];
            const statusLabels = { 'new': 'Новый', 'processing': 'В обработке', 'delivery': 'Доставка', 'pvz': 'В ПВЗ', 'completed': 'Выдан' };
            
            tbody.innerHTML = [...orders].sort((a, b) => b.id - a.id).map(o => {
                const user = users.find(u => u.id === o.userId);
                const productsList = o.products.map(item => {
                    const p = getProduct(item.id);
                    return `${p ? p.name : 'Товар'} × ${item.quantity}`;
                }).join(', ');
                return `
                    <tr>
                        <td>#${o.id}</td>
                        <td>${user ? user.name : 'Неизвестно'}</td>
                        <td>${productsList}</td>
                        <td>${o.total.toLocaleString()} ₽</td>
                        <td><span class="status status-${o.status}">${statusLabels[o.status] || o.status}</span></td>
                        <td>
                            <select onchange="changeStatus(${o.id}, this.value)" style="padding:5px;border-radius:4px;border:1px solid #ddd;">
                                ${statuses.map(s => `<option value="${s}" ${s === o.status ? 'selected' : ''}>${statusLabels[s]}</option>`).join('')}
                            </select>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function changeStatus(orderId, status) {
            if (updateOrderStatus(orderId, status)) {
                renderOrders();
                showNotification('✅ Статус обновлён!', 'success');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if (!user || (user.role !== 'admin' && user.role !== 'super')) {
                window.location.href = '/market/';
                return;
            }
            renderOrders();
        });
    </script>
</body>
</html>
