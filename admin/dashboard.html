<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .admin-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .admin-actions a {
            text-decoration: none;
        }
        .admin-actions .btn {
            display: inline-block;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🛍️ Маркет</div>
        <nav>
            <a href="dashboard.html" class="active">📊 Дашборд</a>
            <a href="products.html">📦 Товары</a>
            <a href="orders.html">📋 Заказы</a>
            <button onclick="logout()" class="btn btn-red">🚪 Выйти</button>
        </nav>
    </header>
    <main>
        <h1>📊 Админ-панель</h1>
        
        <div class="stats-grid">
            <div class="stat-item">
                <div class="number" id="totalProducts">0</div>
                <div class="label">Товаров</div>
            </div>
            <div class="stat-item">
                <div class="number" id="totalOrders">0</div>
                <div class="label">Заказов</div>
            </div>
            <div class="stat-item">
                <div class="number" id="totalUsers">0</div>
                <div class="label">Пользователей</div>
            </div>
        </div>
        
        <div class="card">
            <h2>⚡ Быстрые действия</h2>
            <div class="admin-actions">
                <a href="products.html" class="btn btn-green">📦 Управление товарами</a>
                <a href="orders.html" class="btn btn-blue">📋 Управление заказами</a>
            </div>
        </div>
        
        <div class="card">
            <h2>📋 Последние заказы</h2>
            <div id="recentOrders"></div>
        </div>
    </main>
    <script src="../js/app.js"></script>
    <script>
        function loadDashboard() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            document.getElementById('totalProducts').textContent = products.length;
            document.getElementById('totalOrders').textContent = orders.length;
            document.getElementById('totalUsers').textContent = users.filter(u => u.role === 'user').length;
            
            const recent = [...orders].sort((a, b) => b.id - a.id).slice(0, 5);
            const container = document.getElementById('recentOrders');
            if (recent.length === 0) {
                container.innerHTML = '<p style="color:#666;">Нет заказов</p>';
                return;
            }
            const statusLabels = { 'new': 'Новый', 'processing': 'В обработке', 'delivery': 'Доставка', 'pvz': 'В ПВЗ', 'completed': 'Выполнен' };
            container.innerHTML = recent.map(o => {
                const user = users.find(u => u.id === o.userId);
                return `<div style="padding:8px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;flex-wrap:wrap;gap:5px;">
                    <span>#${o.id} - ${user ? user.name : 'Неизвестно'}</span>
                    <span>${o.total.toLocaleString()} ₽</span>
                    <span class="status status-${o.status}">${statusLabels[o.status] || o.status}</span>
                </div>`;
            }).join('');
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/market/';
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if (!user || user.role !== 'admin') { window.location.href = '/market/'; return; }
            loadDashboard();
        });
    </script>
</body>
</html>
