<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление товарами</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .admin-form { max-width: 500px; margin: 0 auto; }
        .admin-form .btn { width: 100%; }
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #4CAF50;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🛍️ Маркет</div>
        <nav>
            <a href="../super/dashboard.html">👑 Супер</a>
            <a href="products.html" class="active">📦 Товары</a>
            <a href="orders.html">📋 Заказы</a>
            <button onclick="showLogoutModal()" class="btn btn-red" style="padding:8px 16px;font-size:14px;">🚪 Выйти</button>
        </nav>
    </header>
    <main>
        <a href="../super/dashboard.html" class="back-link">← Назад в супер-панель</a>
        <h1>📦 Управление товарами</h1>
        
        <div class="card">
            <h2>➕ Добавить товар</h2>
            <form class="admin-form" onsubmit="handleAddProduct(event)">
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-group">
                    <label>Цена (₽)</label>
                    <input type="number" id="productPrice" required>
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="productDescription" rows="2" style="width:100%;padding:10px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;"></textarea>
                </div>
                <button type="submit" class="btn btn-green">➕ Добавить</button>
            </form>
        </div>
        
        <div class="card">
            <h2>📋 Список товаров</h2>
            <table>
                <thead><tr><th>ID</th><th>Название</th><th>Цена</th><th>Действия</th></tr></thead>
                <tbody id="productsTable"></tbody>
            </table>
        </div>
    </main>

    <!-- ===== МОДАЛЬНОЕ ОКНО ДЛЯ ВЫХОДА ===== -->
    <div class="modal-overlay" id="logoutModal" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;justify-content:center;align-items:center;z-index:10000;">
        <div style="background:white;border-radius:16px;padding:30px;max-width:400px;width:90%;text-align:center;animation:scaleIn 0.3s ease;">
            <div style="font-size:48px;margin-bottom:10px;">🚪</div>
            <h3>Выход из аккаунта</h3>
            <p style="color:#666;font-size:14px;margin-bottom:20px;">Вы уверены, что хотите выйти?</p>
            <div style="display:flex;gap:10px;">
                <button onclick="document.getElementById('logoutModal').style.display='none'" style="flex:1;padding:12px;border:none;border-radius:8px;font-size:16px;cursor:pointer;background:#e0e0e0;color:#333;">Отмена</button>
                <button onclick="logout()" style="flex:1;padding:12px;border:none;border-radius:8px;font-size:16px;cursor:pointer;background:#f44336;color:white;">Выйти</button>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        function showLogoutModal() {
            document.getElementById('logoutModal').style.display = 'flex';
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/market/';
        }

        function renderProducts() {
            const tbody = document.getElementById('productsTable');
            tbody.innerHTML = products.map(p => `
                <tr>
                    <td>${p.id}</td>
                    <td>${p.name}</td>
                    <td>${p.price.toLocaleString()} ₽</td>
                    <td>
                        <button onclick="editProduct(${p.id})" class="btn-small orange">✏️</button>
                        <button onclick="deleteProduct(${p.id})" class="btn-small red">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        function handleAddProduct(e) {
            e.preventDefault();
            const name = document.getElementById('productName').value;
            const price = Number(document.getElementById('productPrice').value);
            const description = document.getElementById('productDescription').value;
            addProduct(name, price, description);
            renderProducts();
            e.target.reset();
            showNotification('✅ Товар добавлен!', 'success');
        }

        function editProduct(id) {
            const p = getProduct(id);
            if (!p) return;
            const name = prompt('Новое название:', p.name);
            if (!name) return;
            const price = prompt('Новая цена:', p.price);
            if (!price) return;
            updateProduct(id, { name, price: Number(price) });
            renderProducts();
            showNotification('✅ Товар обновлён!', 'success');
        }

        function deleteProduct(id) {
            if (!confirm('Удалить товар?')) return;
            deleteProduct(id);
            renderProducts();
            showNotification('✅ Товар удалён!', 'success');
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if (!user || (user.role !== 'admin' && user.role !== 'super')) {
                window.location.href = '/market/';
                return;
            }
            renderProducts();
        });
    </script>
</body>
</html>
