<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПВЗ - Панель</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #4CAF50;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }

        .code-input-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .code-input-section label {
            font-weight: 500;
            font-size: 16px;
        }
        .code-input-section input {
            flex: 1;
            min-width: 180px;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 24px;
            text-align: center;
            letter-spacing: 6px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }
        .code-input-section input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        .code-input-section .btn {
            padding: 12px 28px;
            width: auto;
            font-size: 16px;
        }
        .code-input-section .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .code-status {
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
            min-width: 150px;
            text-align: center;
        }
        .code-status.valid { background: #e8f5e9; color: #2e7d32; }
        .code-status.invalid { background: #ffebee; color: #c62828; }
        .code-status.empty { background: #f5f5f5; color: #999; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            animation: scaleIn 0.3s ease;
        }
        .modal-box .icon { font-size: 48px; margin-bottom: 10px; }
        .modal-box h3 { font-size: 20px; margin-bottom: 8px; color: #333; }
        .modal-box p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .modal-box .order-info {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0 20px;
            text-align: left;
        }
        .modal-box .order-info .label { color: #666; font-size: 13px; }
        .modal-box .order-info .value { font-weight: 500; font-size: 16px; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 500; color: white; }
        .modal-actions .btn-cancel { background: #e0e0e0; color: #333; }
        .modal-actions .btn-confirm { background: #4CAF50; }
        .modal-actions .btn-confirm:hover { background: #388E3C; }
        .modal-actions .btn-danger { background: #f44336; }
        .modal-actions .btn-danger:hover { background: #d32f2f; }
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .order-code-display {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            color: #4CAF50;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🛍️ Маркет</div>
        <nav>
            <a href="../super/dashboard.html">👑 Супер</a>
            <a href="dashboard.html" class="active">📊 ПВЗ</a>
            <button onclick="showLogoutModal()" class="btn btn-red" style="padding:8px 16px;font-size:14px;">🚪 Выйти</button>
        </nav>
    </header>
    <main>
        <a href="../super/dashboard.html" class="back-link">← Назад в супер-панель</a>
        <h1>📦 ПВЗ: <span id="pvzName"></span></h1>
        
        <!-- ===== ВВОД КОДА ДЛЯ ВЫДАЧИ ===== -->
        <div class="code-input-section">
            <label>🔑 Код получения:</label>
            <input type="text" id="orderCodeInput" maxlength="4" 
                   placeholder="Введите 4 цифры" 
                   oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,4); checkCode();">
            <button class="btn btn-green" id="issueBtn" onclick="issueByCode()" disabled>📦 Выдать заказ</button>
            <span id="codeStatus" class="code-status empty">Введите код</span>
        </div>
        
        <div class="stats-grid">
            <div class="stat-item">
                <div class="number" id="totalOrders">0</div>
                <div class="label">Всего заказов</div>
            </div>
            <div class="stat-item">
                <div class="number" id="readyOrders">0</div>
                <div class="label">Готовых к выдаче</div>
            </div>
            <div class="stat-item">
                <div class="number" id="issuedOrders">0</div>
                <div class="label">Выдано</div>
            </div>
        </div>
        
        <div id="ordersContainer"></div>
    </main>

    <!-- ===== МОДАЛЬНОЕ ОКНО ПОДТВЕРЖДЕНИЯ ===== -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
            <div class="icon" id="modalIcon">📦</div>
            <h3 id="modalTitle">Подтверждение выдачи</h3>
            <div id="modalOrderInfo" class="order-info"></div>
            <p id="modalMessage">Выдать заказ?</p>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeConfirmModal()">Отмена</button>
                <button class="btn btn-confirm" id="modalConfirmBtn" onclick="executeConfirm()">✅ Выдать</button>
            </div>
        </div>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО ДЛЯ ВЫХОДА ===== -->
    <div class="modal-overlay" id="logoutModal">
        <div class="modal-box">
            <div class="icon">🚪</div>
            <h3>Выход из аккаунта</h3>
            <p>Вы уверены, что хотите выйти?</p>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="document.getElementById('logoutModal').style.display='none'">Отмена</button>
                <button class="btn btn-danger" onclick="logout()">Выйти</button>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        // =============================================
        // ПЕРЕМЕННЫЕ
        // =============================================
        let confirmCallback = null;
        let foundOrder = null;

        // =============================================
        // КАСТОМНОЕ МОДАЛЬНОЕ ОКНО
        // =============================================
        function showConfirmModal(title, message, icon = '⚠️', orderData = null, callback) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalIcon').textContent = icon;
            document.getElementById('modalMessage').textContent = message;
            
            const infoContainer = document.getElementById('modalOrderInfo');
            if (orderData) {
                infoContainer.innerHTML = `
                    <div><span class="label">Заказ #${orderData.id}</span></div>
                    <div><span class="label">Покупатель:</span> <span class="value">${orderData.buyer}</span></div>
                    <div><span class="label">Сумма:</span> <span class="value">${orderData.total.toLocaleString()} ₽</span></div>
                    <div><span class="label">Код:</span> <span class="value order-code-display">${orderData.code}</span></div>
                `;
            } else {
                infoContainer.innerHTML = '';
            }
            
            confirmCallback = callback;
            document.getElementById('confirmModal').classList.add('active');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('active');
            confirmCallback = null;
            foundOrder = null;
        }

        function executeConfirm() {
            if (confirmCallback) {
                confirmCallback();
            }
            closeConfirmModal();
        }

        // =============================================
        // ПРОВЕРКА КОДА
        // =============================================
        function checkCode() {
            const code = document.getElementById('orderCodeInput').value.trim();
            const statusEl = document.getElementById('codeStatus');
            const btn = document.getElementById('issueBtn');
            
            if (code.length !== 4) {
                statusEl.className = 'code-status empty';
                statusEl.textContent = 'Введите 4 цифры';
                btn.disabled = true;
                foundOrder = null;
                return;
            }
            
            // Ищем заказ с таким кодом и статусом 'pvz'
            const order = orders.find(o => o.code === code && o.status === 'pvz');
            
            if (order) {
                const buyer = users.find(u => u.id === order.userId);
                statusEl.className = 'code-status valid';
                statusEl.textContent = `✅ Заказ #${order.id} (${buyer ? buyer.name : 'Неизвестно'})`;
                btn.disabled = false;
                foundOrder = order;
            } else {
                // Проверяем, есть ли заказ с таким кодом, но не готов
                const existing = orders.find(o => o.code === code);
                if (existing) {
                    statusEl.className = 'code-status invalid';
                    statusEl.textContent = `❌ Заказ #${existing.id} не готов к выдаче (статус: ${existing.status})`;
                } else {
                    statusEl.className = 'code-status invalid';
                    statusEl.textContent = '❌ Код не найден';
                }
                btn.disabled = true;
                foundOrder = null;
            }
        }

        // =============================================
        // ВЫДАЧА ЗАКАЗА ПО КОДУ
        // =============================================
        function issueByCode() {
            if (!foundOrder) {
                showNotification('❌ Заказ не найден или не готов', 'error');
                return;
            }
            
            const buyer = users.find(u => u.id === foundOrder.userId);
            
            showConfirmModal(
                '📦 Выдача заказа',
                'Выдать заказ?',
                '📦',
                {
                    id: foundOrder.id,
                    buyer: buyer ? buyer.name : 'Неизвестно',
                    total: foundOrder.total,
                    code: foundOrder.code
                },
                function() {
                    const result = issueOrder(foundOrder.id);
                    if (result) {
                        document.getElementById('orderCodeInput').value = '';
                        document.getElementById('codeStatus').className = 'code-status empty';
                        document.getElementById('codeStatus').textContent = 'Введите код';
                        document.getElementById('issueBtn').disabled = true;
                        foundOrder = null;
                        renderPVZOrders();
                        showNotification(`✅ Заказ #${foundOrder ? foundOrder.id : ''} выдан!`, 'success');
                    }
                }
            );
        }

        // =============================================
        // ВЫХОД
        // =============================================
        function showLogoutModal() {
            document.getElementById('logoutModal').style.display = 'flex';
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/market/';
        }

        // =============================================
        // ОСТАЛЬНЫЕ ФУНКЦИИ
        // =============================================
        function renderPVZOrders() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            const pvzOrders = user.role === 'super' ? getAllOrders() : getPVZOrders(user.id);
            const container = document.getElementById('ordersContainer');
            
            document.getElementById('totalOrders').textContent = pvzOrders.length;
            document.getElementById('readyOrders').textContent = pvzOrders.filter(o => o.status === 'pvz').length;
            document.getElementById('issuedOrders').textContent = pvzOrders.filter(o => o.status === 'completed').length;
            
            if (pvzOrders.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>📭 Нет заказов</p></div>';
                return;
            }
            
            const statusLabels = { 
                'new': '🆕 Новый', 
                'processing': '⚙️ В обработке', 
                'delivery': '🚚 В доставке', 
                'pvz': '📦 В ПВЗ (готов к выдаче)', 
                'completed': '✅ Выдан' 
            };
            
            container.innerHTML = pvzOrders.map(o => {
                const buyer = users.find(u => u.id === o.userId);
                const productsList = o.products.map(item => {
                    const p = getProduct(item.id);
                    return `${p ? p.name : 'Товар'} × ${item.quantity}`;
                }).join(', ');
                
                let actions = '';
                if (o.status === 'delivery') {
                    actions = `<button onclick="markReady(${o.id})" class="btn btn-green" style="margin-top:10px;">✅ Готов к выдаче</button>`;
                } else if (o.status === 'pvz') {
                    actions = `
                        <button onclick="markReady(${o.id})" class="btn btn-green" style="margin-top:10px;margin-right:10px;">✅ Готов</button>
                        <button onclick="confirmIssueOrder(${o.id})" class="btn btn-blue" style="margin-top:10px;">📦 Выдать</button>
                    `;
                } else if (o.status === 'completed') {
                    actions = `<span style="color:#4CAF50;font-weight:bold;margin-top:10px;display:block;">✅ Заказ выдан</span>`;
                }
                
                return `
                    <div class="order-card">
                        <div class="header">
                            <span class="id">Заказ #${o.id}</span>
                            <span class="date">📅 ${o.date}</span>
                            <span class="status status-${o.status}">${statusLabels[o.status] || o.status}</span>
                        </div>
                        <div><strong>Покупатель:</strong> ${buyer ? buyer.name : 'Неизвестно'}</div>
                        <div><strong>Товары:</strong> ${productsList}</div>
                        <div class="total">💰 ${o.total.toLocaleString()} ₽</div>
                        <div style="margin-top:6px;"><strong>Код:</strong> <span style="font-family:monospace;font-size:18px;font-weight:bold;color:#4CAF50;letter-spacing:2px;">${o.code}</span></div>
                        ${actions}
                    </div>
                `;
            }).join('');
        }

        function confirmIssueOrder(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (!order) return;
            
            const buyer = users.find(u => u.id === order.userId);
            
            showConfirmModal(
                '📦 Выдача заказа',
                'Выдать заказ?',
                '📦',
                {
                    id: order.id,
                    buyer: buyer ? buyer.name : 'Неизвестно',
                    total: order.total,
                    code: order.code
                },
                function() {
                    const result = window.issueOrder(orderId);
                    if (result) renderPVZOrders();
                }
            );
        }

        function markReady(orderId) {
            if (updateOrderStatus(orderId, 'pvz')) {
                showNotification('✅ Заказ готов к выдаче!', 'success');
                renderPVZOrders();
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if (!user || (user.role !== 'pvz' && user.role !== 'super')) {
                window.location.href = '/market/';
                return;
            }
            document.getElementById('pvzName').textContent = user.role === 'super' ? 'Супер (все заказы)' : user.name;
            renderPVZOrders();
        });
    </script>
</body>
</html>
