<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПВЗ - Панель</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #4CAF50;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }

        /* ===== КАСТОМНОЕ МОДАЛЬНОЕ ОКНО ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: scaleIn 0.3s ease;
            text-align: center;
        }
        .modal-box .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .modal-box h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #333;
        }
        .modal-box p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .modal-box .order-id {
            font-weight: bold;
            color: #4CAF50;
            font-size: 18px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        .modal-actions .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 500;
            color: white;
        }
        .modal-actions .btn-cancel {
            background: #e0e0e0;
            color: #333;
        }
        .modal-actions .btn-cancel:hover {
            background: #d0d0d0;
        }
        .modal-actions .btn-confirm {
            background: #4CAF50;
        }
        .modal-actions .btn-confirm:hover {
            background: #388E3C;
        }
        .modal-actions .btn-danger {
            background: #f44336;
        }
        .modal-actions .btn-danger:hover {
            background: #d32f2f;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🛍️ Маркет</div>
        <nav>
            <a href="../super/dashboard.html">👑 Супер</a>
            <a href="dashboard.html" class="active">📊 ПВЗ</a>
            <button onclick="showLogoutModal()" class="btn btn-red" style="padding:8px 16px;font-size:14px;">🚪 Выйти</button>
        </nav>
    </header>
    <main>
        <a href="../super/dashboard.html" class="back-link">← Назад в супер-панель</a>
        <h1>📦 ПВЗ: <span id="pvzName"></span></h1>
        
        <div class="stats-grid">
            <div class="stat-item">
                <div class="number" id="totalOrders">0</div>
                <div class="label">Всего заказов</div>
            </div>
            <div class="stat-item">
                <div class="number" id="readyOrders">0</div>
                <div class="label">Готовых к выдаче</div>
            </div>
            <div class="stat-item">
                <div class="number" id="issuedOrders">0</div>
                <div class="label">Выдано</div>
            </div>
        </div>
        
        <div id="ordersContainer"></div>
    </main>

    <!-- ===== МОДАЛЬНОЕ ОКНО ПОДТВЕРЖДЕНИЯ ===== -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
            <div class="icon" id="modalIcon">⚠️</div>
            <h3 id="modalTitle">Подтверждение</h3>
            <p id="modalMessage">Вы уверены?</p>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeConfirmModal()">Отмена</button>
                <button class="btn btn-danger" id="modalConfirmBtn" onclick="executeConfirm()">✅ Подтвердить</button>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        // =============================================
        // ПЕРЕМЕННЫЕ ДЛЯ МОДАЛЬНОГО ОКНА
        // =============================================
        let confirmCallback = null;

        // =============================================
        // КАСТОМНОЕ МОДАЛЬНОЕ ОКНО
        // =============================================
        function showConfirmModal(title, message, icon = '⚠️', callback) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('modalIcon').textContent = icon;
            confirmCallback = callback;
            document.getElementById('confirmModal').classList.add('active');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('active');
            confirmCallback = null;
        }

        function executeConfirm() {
            if (confirmCallback) {
                confirmCallback();
            }
            closeConfirmModal();
        }

        // =============================================
        // ВЫХОД С ПОДТВЕРЖДЕНИЕМ
        // =============================================
        function showLogoutModal() {
            showConfirmModal(
                '🚪 Выход из аккаунта',
                'Вы уверены, что хотите выйти?',
                '🚪',
                function() {
                    localStorage.removeItem('currentUser');
                    window.location.href = '/market/';
                }
            );
        }

        // =============================================
        // ВЫДАЧА ЗАКАЗА С ПОДТВЕРЖДЕНИЕМ
        // =============================================
        function confirmIssueOrder(orderId) {
            showConfirmModal(
                '📦 Выдача заказа',
                'Выдать заказ #' + orderId + '?',
                '📦',
                function() {
                    const result = window.issueOrder(orderId);
                    if (result) renderPVZOrders();
                }
            );
        }

        // =============================================
        // ОСТАЛЬНЫЕ ФУНКЦИИ
        // =============================================
        function renderPVZOrders() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            const pvzOrders = user.role === 'super' ? getAllOrders() : getPVZOrders(user.id);
            const container = document.getElementById('ordersContainer');
            
            document.getElementById('totalOrders').textContent = pvzOrders.length;
            document.getElementById('readyOrders').textContent = pvzOrders.filter(o => o.status === 'pvz').length;
            document.getElementById('issuedOrders').textContent = pvzOrders.filter(o => o.status === 'completed').length;
            
            if (pvzOrders.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>📭 Нет заказов</p></div>';
                return;
            }
            
            const statusLabels = { 
                'new': '🆕 Новый', 
                'processing': '⚙️ В обработке', 
                'delivery': '🚚 В доставке', 
                'pvz': '📦 В ПВЗ', 
                'completed': '✅ Выдан' 
            };
            
            container.innerHTML = pvzOrders.map(o => {
                const buyer = users.find(u => u.id === o.userId);
                const productsList = o.products.map(item => {
                    const p = getProduct(item.id);
                    return `${p ? p.name : 'Товар'} × ${item.quantity}`;
                }).join(', ');
                
                let actions = '';
                if (o.status === 'delivery') {
                    actions = `<button onclick="markReady(${o.id})" class="btn btn-green" style="margin-top:10px;">✅ Готов к выдаче</button>`;
                } else if (o.status === 'pvz') {
                    actions = `
                        <button onclick="markReady(${o.id})" class="btn btn-green" style="margin-top:10px;margin-right:10px;">✅ Готов</button>
                        <button onclick="confirmIssueOrder(${o.id})" class="btn btn-blue" style="margin-top:10px;">📦 Выдать</button>
                    `;
                } else if (o.status === 'completed') {
                    actions = `<span style="color:#4CAF50;font-weight:bold;margin-top:10px;display:block;">✅ Заказ выдан</span>`;
                }
                
                return `
                    <div class="order-card">
                        <div class="header">
                            <span class="id">Заказ #${o.id}</span>
                            <span class="date">📅 ${o.date}</span>
                            <span class="status status-${o.status}">${statusLabels[o.status] || o.status}</span>
                        </div>
                        <div><strong>Покупатель:</strong> ${buyer ? buyer.name : 'Неизвестно'}</div>
                        <div><strong>Товары:</strong> ${productsList}</div>
                        <div class="total">💰 ${o.total.toLocaleString()} ₽</div>
                        ${actions}
                    </div>
                `;
            }).join('');
        }

        function markReady(orderId) {
            if (updateOrderStatus(orderId, 'pvz')) {
                showNotification('✅ Заказ готов к выдаче!', 'success');
                renderPVZOrders();
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if (!user || (user.role !== 'pvz' && user.role !== 'super')) {
                window.location.href = '/market/';
                return;
            }
            document.getElementById('pvzName').textContent = user.role === 'super' ? 'Супер (все заказы)' : user.name;
            renderPVZOrders();
        });
    </script>
</body>
</html>
